<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>STEP 相似检索</title>
  <link rel="stylesheet" href="./style.css">
  <script type="importmap">{"imports":{"three":"./vendor/build/three.module.min.js","three/addons/":"./vendor/examples/jsm/"}}</script>
</head>
<body>
  <header class="top app-top">
    <h1>STEP 相似检索</h1>
    <button id="open-library" type="button">基础模型库</button>
  </header>
  <main class="workbench">
    <section class="card upload">
      <div class="upload-label">
        <label for="upload" class="upload-button">上传 STEP</label>
        <input id="upload" class="sr-only" type="file" accept=".step,.stp">
        <span class="hint">.step / .stp · 最大 32 MB</span>
      </div>
      <div class="query-label">
        <span id="query-name"></span>
      </div>
      <output id="query-status" role="status" aria-live="polite" data-state="idle">等待上传</output>
    </section>
    <div class="workbench-grid">
      <aside class="card results" aria-label="检索结果">
        <h2>几何候选 <span id="candidate-count"></span></h2>
        <p id="result-hint" class="hint">上传后显示最多 5 个候选。</p>
        <ol id="candidates" class="model-list"></ol>
        <details id="review-group" hidden>
          <summary>待复核 <span id="review-count"></span></summary>
          <ul id="review" class="model-list"></ul>
        </details>
      </aside>
      <section id="viewer" class="card viewer" aria-label="三维对比"></section>
    </div>
  </main>
  <dialog id="library">
    <div class="dialog-head">
      <h2>基础模型库 <span id="library-count"></span></h2>
      <div class="dialog-actions">
        <button id="open-library-folder" type="button" hidden>模型库文件夹</button>
        <form method="dialog"><button type="submit">关闭</button></form>
      </div>
    </div>
    <div id="library-status" role="status"></div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>模型标识</th><th>文件</th><th>料号</th><th>导入</th></tr></thead>
        <tbody id="library-body"></tbody>
      </table>
    </div>
  </dialog>
  <dialog id="score-dialog" aria-labelledby="score-title">
    <div class="dialog-head">
      <h2 id="score-title">相似度评分详情</h2>
      <form method="dialog"><button type="submit" autofocus>关闭</button></form>
    </div>
    <div class="score-summary">
      <div>
        <strong id="score-model"></strong>
        <p id="score-review" class="review-reason" hidden></p>
      </div>
      <div class="score-total"><span id="score-total"></span> <small>/ 100</small></div>
    </div>
    <div class="table-wrap">
      <table class="score-table">
        <thead><tr><th scope="col">评分项</th><th scope="col">实测误差</th><th scope="col">得分 / 满分</th><th scope="col">零分阈值</th></tr></thead>
        <tbody id="score-body"></tbody>
      </table>
    </div>
    <div class="score-notes">
      <p>误差为 0 时得满分，达到零分阈值时得 0 分，其间按比例扣分。</p>
    </div>
  </dialog>
  <dialog id="library-load-progress" aria-labelledby="library-load-title">
    <div class="progress-heading">
      <h2 id="library-load-title">正在加载基础模型库</h2>
      <output id="library-load-percent">--</output>
    </div>
    <p id="library-load-file"></p>
    <progress id="library-load-meter" max="100" value="0" aria-label="基础模型库加载进度"></progress>
    <form class="progress-actions" method="dialog">
      <button id="library-load-close" type="submit" hidden>关闭</button>
    </form>
  </dialog>
  <dialog id="comparison-progress" aria-labelledby="progress-title" aria-describedby="progress-stage">
    <div class="progress-heading">
      <h2 id="progress-title">正在比对 STEP</h2>
      <output id="progress-percent">0%</output>
    </div>
    <p id="progress-file"></p>
    <progress id="progress-meter" max="100" value="0" aria-label="比对进度"></progress>
    <p id="progress-stage" role="status" aria-live="polite">正在提交文件</p>
    <form class="progress-actions" method="dialog">
      <button id="progress-close" type="submit" hidden>关闭</button>
    </form>
  </dialog>
  <script type="module" src="./app.js"></script>
</body>
</html>
